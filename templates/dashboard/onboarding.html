{% extends 'base.html' %}
{% load static %}

{% block title %}
  Business Onboarding - BookySaaS
{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %}

{% block content %}
  <section class="auth-container">
    <div class="auth-card" style="max-width: 600px;">
      <div class="auth-header">
        <h1 class="auth-title">Complete Your Profile</h1>
        <p class="auth-subtitle">Tell us about your business to get started</p>
      </div>

      <div class="auth-forms-wrapper">
        <form class="auth-form active" action="{% url 'dashboard:onboarding' %}" method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="business_name">Business Name</label>
            <input type="text" id="business_name" name="business_name" class="form-control" placeholder="My Awesome Business" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="category">Business Category</label>
            <select id="category" name="category" class="form-control" required>
              <option value="" disabled selected>Select your industry</option>
              <option value="Beauty & wellness">Beauty & wellness</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Fitness">Fitness</option>
              <option value="Education & coaching">Education & coaching</option>
              <option value="Professional consulting">Professional consulting</option>
              <option value="Creative services">Creative services</option>
              <option value="Automotive">Automotive</option>
              <option value="Home services">Home services</option>
              <option value="Hospitality">Hospitality</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-control" placeholder="Briefly describe your business..." rows="3"></textarea>
          </div>

          <div class="form-group" style="display: flex; gap: 1rem;">
            <div style="flex: 1;">
              <label class="form-label" for="phone">Phone Number</label>
              <input type="text" id="phone" name="phone" class="form-control" placeholder="+1234567890" />
            </div>
            <div style="flex: 1;">
              <label class="form-label" for="email">Business Email</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="contact@business.com" />
            </div>
          </div>

          <div class="form-group" style="display: flex; gap: 1rem;">
            <div style="flex: 2;">
              <label class="form-label" for="address">Address</label>
              <input type="text" id="address" name="address" class="form-control" placeholder="123 Main St" />
            </div>
            <div style="flex: 1;">
              <label class="form-label" for="city">City</label>
              <input type="text" id="city" name="city" class="form-control" placeholder="City" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Save & Continue to Dashboard</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
